<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tomas Alvarez</title>
<meta name="description" content="Tomas Alvarez, Game Designer based in Vancouver, Canada.">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<style>
  :root { --font: 'Space Grotesk', system-ui, sans-serif; }

  .hero {
    position: relative; min-height: 100svh; display: flex; align-items: center;
    padding: 110px 0 80px; overflow: hidden;
  }
  #dots { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  .hero .wrap { position: relative; pointer-events: none; }
  .hero .wrap a { pointer-events: auto; }
  .hero h1 {
    margin: 18px 0 0; font-weight: 700; letter-spacing: -.05em; line-height: .92;
    font-size: clamp(60px, 12vw, 176px);
  }
  .hero h1 .outline {
    color: transparent; -webkit-text-stroke: 2px var(--accent);
  }
  .hero-bottom {
    margin-top: clamp(28px, 4vw, 44px);
    display: flex; gap: 28px; align-items: center; flex-wrap: wrap;
  }
  .hero-bottom p { margin: 0; max-width: 420px; color: var(--muted); font-size: 18px; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px;
    padding: 14px 22px; border-radius: 999px; background: var(--accent); color: var(--on-accent);
    transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s;
  }
  .btn:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
  .hint {
    position: absolute; right: var(--gutter); bottom: 84px; font-size: 13px; color: var(--muted);
    display: flex; align-items: center; gap: 8px; pointer-events: none;
    background: var(--surface); border: 1px solid var(--line); padding: 7px 14px; border-radius: 999px;
  }
  .hint b { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: ping 1.6s infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 var(--accent); } 100% { box-shadow: 0 0 0 10px transparent; } }
  @media (max-width: 640px) { .hint { display: none; } }

  /* Intro: words slide up from a mask */
  .line { display: block; overflow: hidden; padding-bottom: .04em; }
  .line > span { display: inline-block; transform: translateY(105%); animation: up 1s cubic-bezier(.2,.8,.2,1) forwards; }
  .line:nth-child(2) > span { animation-delay: .12s; }
  .fade-in { opacity: 0; animation: fade .9s .45s ease forwards; }
  @keyframes up { to { transform: none; } }
  @keyframes fade { to { opacity: 1; } }

  /* Halftone accents elsewhere on the page */
  .projects { background:
      radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--accent) 28%, transparent) 1px, transparent 1.5px) 0 0 / 18px 18px;
 }
  .projects::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(var(--bg), transparent 18%, transparent 82%, var(--bg));
  }
  .projects .wrap { position: relative; }
  .project-media::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(circle, rgba(34,86,242,.55) 1.2px, transparent 1.8px) 0 0 / 7px 7px;
    mix-blend-mode: multiply; transition: opacity .5s;
  }
  .project:hover .project-media::after { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .line > span, .fade-in { animation: none; transform: none; opacity: 1; } }
</style>
</head>
<body id="top">
<section class="hero">
  <canvas id="dots" aria-hidden="true"></canvas>
  <div class="wrap">
    <span class="eyebrow fade-in">Game Designer · Vancouver, Canada</span>
    <h1><span class="line"><span>Tomas</span></span><span class="line"><span class="outline">Alvarez</span></span></h1>
    <div class="hero-bottom fade-in">
      <a class="btn" href="#work">See my work <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></a>
      <p>Designing games that are fun, cohesive and memorable, across design, programming, art and production.</p>
    </div>
  </div>
  <div class="hint"><b></b>Move &amp; click the dots</div>
</section>
<main id="main"></main>

<script src="../shared/base.js"></script>
<script>
  renderStandard(document.getElementById('main'));
  renderFooter();
  renderVersionPill('v2-halftone');
  initReveal();

  // ---------- Halftone dot field ----------
  (function () {
    const canvas = document.getElementById('dots');
    const ctx = canvas.getContext('2d');
    const GAP = 16;
    let W, H, dpr, cols, rows, color;
    const mouse = { x: -9999, y: -9999, sx: -9999, sy: -9999 };
    const ripples = [];

    function readColor() { color = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2256F2'; }
    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      const r = canvas.getBoundingClientRect();
      W = r.width; H = r.height;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cols = Math.ceil(W / GAP) + 1; rows = Math.ceil(H / GAP) + 1;
    }
    readColor(); resize();
    addEventListener('resize', resize);
    addEventListener('themechange', () => requestAnimationFrame(readColor));

    canvas.parentElement.addEventListener('pointermove', e => {
      const r = canvas.getBoundingClientRect();
      mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
      if (mouse.sx < -999) { mouse.sx = mouse.x; mouse.sy = mouse.y; }
    });
    canvas.parentElement.addEventListener('pointerleave', () => { mouse.x = mouse.y = -9999; });
    canvas.parentElement.addEventListener('pointerdown', e => {
      const r = canvas.getBoundingClientRect();
      ripples.push({ x: e.clientX - r.left, y: e.clientY - r.top, t: 0 });
    });
    // an occasional ambient ripple so the field breathes on its own
    setInterval(() => { if (ripples.length < 3) ripples.push({ x: W * (.55 + Math.random() * .4), y: H * (.15 + Math.random() * .7), t: 0, soft: true }); }, 3800);

    let visible = true;
    new IntersectionObserver(([e]) => visible = e.isIntersecting).observe(canvas);

    let last = performance.now();
    (function frame(now) {
      requestAnimationFrame(frame);
      if (!visible) return;
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      const t = reducedMotion ? 0 : now / 1000;
      mouse.sx += (mouse.x - mouse.sx) * .15; mouse.sy += (mouse.y - mouse.sy) * .15;
      if (mouse.x < -999) { mouse.sx = mouse.sy = -9999; }
      for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > 2.6) ripples.splice(i, 1); }

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = color;
      const maxR = GAP * .46;
      const textSide = W > 760;
      ctx.beginPath();
      for (let j = 0; j < rows; j++) {
        const y = j * GAP;
        for (let i = 0; i < cols; i++) {
          const x = i * GAP + (j % 2 ? GAP / 2 : 0);
          const nx = x / W, ny = y / H;
          // big slow diagonal waves = the "halftone gradient"
          let v = .5 + .5 * Math.sin(nx * 5.2 + ny * 2.4 - t * .6) * Math.cos(ny * 4.1 - nx * 1.3 + t * .35);
          v = v * v;
          // keep the left (text) side calmer on wide screens
          const side = textSide ? Math.min(1, Math.max(.12, (nx - .25) * 1.6)) : .45;
          v *= side;
          // fade out at the bottom edge into the page
          v *= Math.min(1, (1 - ny) * 3) * Math.min(1, Math.max(0, (y - 70) / 110));
          // cursor lens
          const dx = x - mouse.sx, dy = y - mouse.sy;
          const d2 = dx * dx + dy * dy;
          v += Math.exp(-d2 / 9000) * .9;
          // ripples
          for (const r of ripples) {
            const d = Math.hypot(x - r.x, y - r.y);
            const front = r.t * 420;
            const w = Math.exp(-((d - front) ** 2) / 1400) * (1 - r.t / 2.6) * (r.soft ? .45 : 1);
            v += w;
          }
          if (v < .03) continue;
          const rad = Math.min(maxR, maxR * v);
          ctx.moveTo(x + rad, y); ctx.arc(x, y, rad, 0, 6.2832);
        }
      }
      ctx.fill();
    })(last);
  })();
</script>
</body>
</html>
