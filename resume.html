<!doctype html>
<html lang="en" data-home="index.html" data-playground="playground.html" data-dock>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/logo-64.png">
<link rel="apple-touch-icon" href="assets/logo-256.png">
<title>Resume · Tomas Alvarez</title>
<meta name="description" content="Resume of Tomas Alvarez, Game Designer with a UI/UX background, based in Vancouver, Canada.">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="style.css">
<style>
  .r-hero { padding: 120px 0 24px; }
  .back { display: flex; width: fit-content; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--muted); margin-bottom: 22px; }
  .back:hover { color: var(--text); }
  .r-hero h1 { margin: 12px 0 0; font-size: clamp(32px, 5vw, 64px); text-transform: uppercase; letter-spacing: -.01em; line-height: 1; }
  .r-bar { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 22px; }
  .r-bar p { margin: 0; color: var(--muted); font-size: 15px; }
  .r-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .r-actions .btn { padding: 11px 16px; font-size: 14px; border-radius: 10px; box-shadow: 3px 3px 0 var(--hl); }
  .r-actions .btn.ghost, :root[data-theme="dark"] .r-actions .btn.ghost { background: transparent; color: var(--text); border: 1.5px solid var(--line); box-shadow: none; }
  .r-actions .btn.ghost:hover { border-color: var(--accent); }

  /* the pages: rendered PDF on white "paper" with the site's hard shadow */
  .r-pages { display: grid; gap: 22px; justify-items: center; padding: 18px 0 90px; }
  .r-page { position: relative; width: 100%; max-width: 860px; background: #fff; border-radius: 6px; overflow: hidden;
    box-shadow: 8px 8px 0 var(--blue-2), 0 30px 60px -30px rgba(0,0,0,.6); }
  .r-page canvas { display: block; width: 100%; height: auto; }
  .r-page a { position: absolute; display: block; border-radius: 2px; }
  .r-page a:hover { background: rgba(34, 86, 242, .14); outline: 1.5px solid rgba(34, 86, 242, .5); }
  .r-loading { padding: 60px 0; text-align: center; color: var(--muted); }
  .r-fallback { width: 100%; max-width: 860px; height: 80vh; border: 0; border-radius: 6px; background: #fff; }
</style>
</head>
<body id="top">
<section class="r-hero">
  <div class="wrap">
    <a class="back" href="index.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Back to home</a>
    <span class="eyebrow">Resume</span>
    <h1>Tomas Alvarez</h1>
    <div class="r-bar">
      <p>Game Designer · UI/UX background · Vancouver, Canada</p>
      <div class="r-actions">
        <a class="btn" href="assets/Tomas-Alvarez-Resume.pdf" download>Download PDF <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></svg></a>
        <a class="btn ghost" href="assets/Tomas-Alvarez-Resume.pdf" target="_blank" rel="noopener">Open full screen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 17L17 7M8 7h9v9"/></svg></a>
      </div>
    </div>
  </div>
</section>

<main class="wrap">
  <div class="r-pages" id="pages"><div class="r-loading">Loading resume…</div></div>
</main>

<script src="shared/base.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  renderFooter();
  renderContactDock();

  // ---------- PDF viewer: each page drawn to a canvas, with its links laid on top ----------
  (async function () {
    const URL_PDF = 'assets/Tomas-Alvarez-Resume.pdf';
    const box = document.getElementById('pages');
    const fallback = () => { box.innerHTML = `<iframe class="r-fallback" src="${URL_PDF}" title="Tomas Alvarez resume"></iframe>`; };
    if (!window.pdfjsLib) return fallback();
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    let pdf;
    try { pdf = await pdfjsLib.getDocument(URL_PDF).promise; } catch (e) { return fallback(); }

    async function render() {
      const width = Math.min(box.clientWidth, 860);
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      const frag = document.createDocumentFragment();
      for (let n = 1; n <= pdf.numPages; n++) {
        const page = await pdf.getPage(n);
        const base = page.getViewport({ scale: 1 });
        const vp = page.getViewport({ scale: width / base.width });
        const wrap = document.createElement('div'); wrap.className = 'r-page';
        wrap.setAttribute('aria-label', `Resume page ${n} of ${pdf.numPages}`);
        const canvas = document.createElement('canvas');
        canvas.width = Math.floor(vp.width * dpr); canvas.height = Math.floor(vp.height * dpr);
        wrap.appendChild(canvas);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: page.getViewport({ scale: vp.scale * dpr }) }).promise;
        // clickable links (Portfolio, LinkedIn, project names…), positioned as percentages so they scale with the page
        for (const a of await page.getAnnotations()) {
          if (a.subtype !== 'Link' || !a.url) continue;
          const [x1, y1, x2, y2] = vp.convertToViewportRectangle(a.rect);
          const link = document.createElement('a');
          link.href = a.url; link.target = '_blank'; link.rel = 'noopener';
          link.setAttribute('aria-label', a.url);
          Object.assign(link.style, {
            left: Math.min(x1, x2) / vp.width * 100 + '%', top: Math.min(y1, y2) / vp.height * 100 + '%',
            width: Math.abs(x2 - x1) / vp.width * 100 + '%', height: Math.abs(y2 - y1) / vp.height * 100 + '%'
          });
          wrap.appendChild(link);
        }
        frag.appendChild(wrap);
      }
      box.replaceChildren(frag);
    }
    await render();
    // re-draw sharply if the window size changes a lot (e.g. rotating a phone)
    let lastW = box.clientWidth, t;
    addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => { if (Math.abs(box.clientWidth - lastW) > 80) { lastW = box.clientWidth; render(); } }, 250); });
  })();
</script>
</body>
</html>
