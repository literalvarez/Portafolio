<!doctype html>
<html lang="en" data-home="index.html" data-hobbies="hobbies.html" data-dock>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="../assets/logo-64.png">
<link rel="apple-touch-icon" href="../assets/logo-256.png">
<title>Hobbies · Tomas Alvarez</title>
<meta name="description" content="Music, experiments and passion projects by Tomas Alvarez.">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
<style>
  .pg-hero { position: relative; padding: 150px 0 60px; overflow: hidden; }
  .pg-hero::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(circle, var(--accent) 2.4px, transparent 3px),
      radial-gradient(circle, var(--accent) 2.4px, transparent 3px);
    background-size: 18px 31.18px; background-position: 0 0, 9px 15.59px;
    -webkit-mask-image: radial-gradient(ellipse 60% 80% at 100% 0%, #000, transparent 70%);
            mask-image: radial-gradient(ellipse 60% 80% at 100% 0%, #000, transparent 70%);
    opacity: .7; animation: drift 14s linear infinite;
  }
  @keyframes drift { to { background-position: 18px 31.18px, 27px 46.77px; } }
  .pg-hero .wrap { position: relative; }
  .back { display: flex; width: fit-content; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--muted); margin-bottom: 26px; }
  .back:hover { color: var(--text); }
  .pg-hero h1 { margin: 14px 0 0; font-size: clamp(36px, 5.4vw, 76px); font-weight: 800; letter-spacing: -.04em; line-height: .9; text-transform: uppercase; }
  .pg-hero p { margin: 22px 0 0; max-width: 560px; font-size: clamp(18px, 1.7vw, 21px); font-weight: 500; }


  /* layout: sticky category sidebar + content, like the project pages */
  .h-body { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: clamp(32px, 5vw, 64px); }
  .toc { position: sticky; top: 96px; align-self: start; display: grid; gap: 2px; padding-top: 30px; }
  .toc span { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .toc a { font-size: 14px; font-weight: 600; color: var(--muted); padding: 7px 0 7px 16px; border-left: 2px solid var(--line); transition: color .2s, border-color .2s, padding .25s; }
  .toc a:hover { color: var(--text); }
  .toc a.on { color: var(--text); border-color: var(--accent); padding-left: 20px; }
  /* phones: the sidebar becomes a sticky strip under the nav */
  @media (max-width: 900px) {
    .h-body { grid-template-columns: 1fr; gap: 0; }
    .toc { top: 62px; z-index: 20; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 10px 0; margin: 0 calc(-1 * var(--gutter)); padding-inline: var(--gutter); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .toc::-webkit-scrollbar { display: none; }
    .toc span { display: none; }
    .toc a { flex: none; border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 14px; }
    .toc a.on { padding-left: 14px; background: var(--blue-2); border-color: var(--blue-2); color: #fff; }
  }
  .group { padding: 30px 0 90px; scroll-margin-top: 80px; }
  .group-head { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
  .group-head h2 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .group-head i { flex: 1; height: 1.5px; background: var(--line); }
  .group-head span { font-size: 14px; color: var(--muted); font-weight: 600; }

  .tracks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
  .track {
    display: grid; grid-template-columns: 132px 1fr; gap: 20px; align-items: center;
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 14px;
    scroll-margin-top: 100px; transition: translate .25s, box-shadow .25s, border-color .25s;
  }
  .track:hover, .track:target { translate: -4px -4px; box-shadow: 8px 8px 0 var(--accent); border-color: var(--accent); }
  .cover { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--blue-1); isolation: isolate; }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.15); mix-blend-mode: luminosity; opacity: .65; z-index: -1; }
  .cover::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, rgba(2,5,26,.5) 1.4px, transparent 2px) 0 0 / 8px 8px; }
  .play {
    position: absolute; z-index: 1; left: 50%; top: 50%; translate: -50% -50%; width: 48px; height: 48px; border-radius: 50%;
    background: #fff; color: var(--blue-1); border: 0; cursor: pointer; display: grid; place-items: center;
    box-shadow: 3px 3px 0 var(--blue-1); transition: transform .2s;
  }
  .play:hover:not(:disabled) { transform: scale(1.08); }
  .play:disabled { cursor: not-allowed; opacity: .85; }
  .play svg { width: 20px; height: 20px; }
  .track .kind { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .track h3 { margin: 4px 0 2px; font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: -.02em; line-height: 1.05; }
  .track .from { font-size: 14px; font-weight: 600; }
  .track p { margin: 8px 0 0; font-size: 14.5px; color: var(--muted); line-height: 1.5; }
  .progress-bar { margin-top: 12px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; cursor: pointer; transition: height .15s; }
  .progress-bar:hover { height: 8px; }
  .player-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 6px; }
  .player-row .time { font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .player-row .soon { margin-top: 0; }
  .progress-bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .soon { margin-top: 10px; font-size: 12px; font-weight: 700; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  .soon::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .soon.ext { color: var(--accent); }
  .soon.ext::before { background: var(--accent); }
  .soon.ext:hover { color: var(--text); }
  .cover iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 2; }
  .track:has(.cover.playing) { grid-template-columns: 240px 1fr; }
  .cover.playing { aspect-ratio: 16 / 9; }
  @media (max-width: 480px) { .track:has(.cover.playing) { grid-template-columns: 1fr; } }
  /* ---------- Video cards: the main way hobbies are shown ---------- */
  .videos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px 24px; }
  .vcard { scroll-margin-top: 100px; }
  .yt {
    position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden;
    background: #000; border: 1.5px solid var(--line); cursor: pointer; padding: 0; color: #fff; font: inherit;
    transition: translate .25s, box-shadow .25s, border-color .25s;
  }
  .yt:hover, .vcard:target .yt { translate: -4px -4px; box-shadow: 8px 8px 0 var(--accent); border-color: var(--accent); }
  .yt img { width: 100%; height: 100%; object-fit: cover; opacity: .85; transition: opacity .3s, transform .6s cubic-bezier(.2,.8,.2,1); }
  .yt:hover img { opacity: 1; transform: scale(1.04); }
  .yt .pl { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 64px; height: 64px; border-radius: 50%; background: var(--blue-2); display: grid; place-items: center; box-shadow: 4px 4px 0 var(--blue-1); transition: scale .2s; }
  .yt:hover .pl { scale: 1.08; }
  .yt .pl svg { width: 24px; height: 24px; margin-left: 3px; }
  .yt .cap { position: absolute; left: 12px; top: 12px; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; background: rgba(2,5,26,.75); padding: 5px 9px; border-radius: 6px; }
  .yt iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .yt.on { cursor: default; translate: none; box-shadow: none; }
  .vbody { padding: 16px 4px 0; }
  .vbody .kind { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .vbody h3 { margin: 4px 0 0; font-size: clamp(22px, 2.4vw, 28px); font-weight: 900; text-transform: uppercase; letter-spacing: -.02em; line-height: 1.05; }
  .vbody p { margin: 8px 0 0; font-size: 15px; color: var(--muted); line-height: 1.5; max-width: 520px; }
  /* optional "audio only" mini player under a video */
  .mini { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 8px 12px 8px 8px; border: 1.5px solid var(--line); border-radius: 999px; max-width: 420px; }
  .mini .play { position: static; translate: none; flex: none; width: 34px; height: 34px; box-shadow: 2px 2px 0 var(--blue-1); }
  .mini .play svg { width: 14px; height: 14px; }
  .mini .label { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .mini .progress-bar { flex: 1; margin: 0; }
  .mini .time { font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* itch.io game cards: whole cover art on a blurred copy of itself, so nothing is cropped */
  .game {
    position: relative; display: block; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; isolation: isolate;
    border: 1.5px solid var(--line); background: #10132a; color: #fff;
    transition: translate .25s, box-shadow .25s, border-color .25s;
  }
  .game:hover, .vcard:target .game { translate: -4px -4px; box-shadow: 8px 8px 0 var(--accent); border-color: var(--accent); }
  .game .blur { position: absolute; inset: -20px; width: calc(100% + 40px); height: calc(100% + 40px); object-fit: cover; filter: blur(22px) saturate(1.2) brightness(.55); z-index: -1; }
  .game .art { height: 100%; width: auto; max-width: 100%; margin: 0 auto; display: block; object-fit: contain; transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  .game .art.pixel { image-rendering: pixelated; }
  .game:hover .art { transform: scale(1.04); }
  .game .cap { position: absolute; left: 12px; top: 12px; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; background: rgba(2,5,26,.75); padding: 5px 9px; border-radius: 6px; }
  .game .itch {
    position: absolute; right: 12px; bottom: 12px; display: inline-flex; align-items: center; gap: 6px;
    background: #fff; color: var(--blue-1); font-size: 13px; font-weight: 800; padding: 8px 12px; border-radius: 9px;
    box-shadow: 3px 3px 0 var(--blue-1); transition: background-color .2s, color .2s;
  }
  .game:hover .itch { background: var(--blue-2); color: #fff; }
  /* SoundCloud card: artwork until clicked, then SoundCloud's player with the tracklist */
  button.sc { width: 100%; padding: 0; font: inherit; cursor: pointer; }
  .sc .pl { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 64px; height: 64px; border-radius: 50%; background: #ff5500; color: #fff; display: grid; place-items: center; box-shadow: 4px 4px 0 #b23b00; transition: scale .2s; }
  .sc:hover .pl { scale: 1.08; }
  .sc .pl svg { width: 24px; height: 24px; margin-left: 3px; }
  .sc.on { aspect-ratio: auto; height: 380px; cursor: default; translate: none; box-shadow: none; background: var(--surface); }
  .sc iframe { display: block; width: 100%; height: 100%; border: 0; }
  /* arriving from the home page: briefly flash the card you came for */
  .vcard.arrived button.yt, .vcard.arrived .game { animation: arrived 1.6s ease-out; }
  @keyframes arrived { 0%, 40% { translate: -4px -4px; box-shadow: 10px 10px 0 var(--accent); border-color: var(--accent); } 100% { translate: 0 0; box-shadow: 0 0 0 transparent; } }
  .vbody .role-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; margin-top: 12px; font-size: 14px; font-weight: 700; color: var(--text); }
  .vbody .role-line b { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .vbody .team { display: block; margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .tracks-head { margin: 48px 0 18px; font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  @media (max-width: 860px) { .videos { grid-template-columns: 1fr; } }

  @media (max-width: 860px) { .tracks { grid-template-columns: 1fr; } }
  @media (max-width: 480px) { .track { grid-template-columns: 96px 1fr; gap: 14px; } .track h3 { font-size: 20px; } }
  @media (prefers-reduced-motion: reduce) { .pg-hero::before { animation: none; } }
</style>
</head>
<body id="top">
<section class="pg-hero">
  <div class="wrap">
    <a class="back" href="index.html#hobbies"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Back to home</a>
    <span class="eyebrow">Hobbies</span>
    <h1>Passion <span>projects</span></h1>
    <p>The things I make for fun: music I compose as TERAL and for my games, audio-reactive visuals, interactive experiments, and games I've made at game jams.</p>
  </div>
</section>

<div class="wrap h-body">
  <nav class="toc" id="toc" aria-label="Categories"><span>Categories</span></nav>
  <main id="groups"></main>
</div>

<script src="../shared/base.js"></script>
<script>
  renderFooter();
  renderContactDock();

  const items = SITE.playground;
  const playIcon = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';
  const pauseIcon = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>';

  const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g, '-');
  const types = [...new Set(items.map(i => i.type))];
  function render() {

    document.getElementById('groups').innerHTML = types.map(type => {
      const list = items.filter(i => i.type === type);
      const videos = list.filter(t => t.yt);          // YouTube is the main way to show a hobby
      const sets = list.filter(t => !t.yt && t.sc);              // SoundCloud tracks/playlists
      const games = list.filter(t => !t.yt && !t.sc && t.link);  // playable games (e.g. game jams) get itch.io cards
      const others = list.filter(t => !t.yt && !t.sc && !t.link); // MP3-only (or not ready yet) items get compact rows
      const src = p => /^https?:/.test(p) ? p : `../assets/${p}`;
      const seek = t => `<div class="progress-bar" role="slider" aria-label="Seek ${t.title}"><i></i></div>`;
      return `<section class="group" id="${slug(type)}">
        <div class="group-head"><h2>${type}</h2><i></i><span>${list.length} ${list.length === 1 ? 'item' : 'items'}</span></div>
        <div class="videos">
          ${videos.map((t, i) => `
            <article class="vcard pv-in" id="${t.id}" data-item style="--d:${i * 60}ms">
              <button class="yt" data-id="${t.yt}" aria-label="Play ${t.title}"><span class="cap">${t.from}</span></button>
              <div class="vbody">
                <span class="kind">${t.use}</span>
                <h3>${t.title}</h3>
                <p>${t.text}</p>
                ${t.audio ? `<div class="mini"><button class="play" data-src="../assets/${t.audio}" aria-label="Play ${t.title} audio only">${playIcon}</button><span class="label">Audio only</span>${seek(t)}<span class="time">0:00</span></div>` : ''}
              </div>
            </article>`).join('')}
          ${sets.map((t, i) => `
            <article class="vcard pv-in" id="${t.id}" data-item style="--d:${(videos.length + i) * 60}ms">
              <button class="sc game" data-sc="${t.sc}" aria-label="Play ${t.title} on SoundCloud">
                <img class="blur" src="${src(t.cover || t.img)}" alt="" aria-hidden="true">
                <img class="art" src="${src(t.cover || t.img)}" alt="${t.title} artwork" loading="lazy">
                <span class="cap">${t.from}</span>
                <span class="pl">${playIcon}</span>
              </button>
              <div class="vbody">
                <span class="kind">${t.use}</span>
                <h3>${t.title}</h3>
                <p>${t.text}</p>
                ${t.scLink ? `<a class="soon ext" href="${t.scLink}" target="_blank" rel="noopener">Open on SoundCloud</a>` : ''}
              </div>
            </article>`).join('')}
          ${games.map((t, i) => `
            <article class="vcard pv-in" id="${t.id}" data-item style="--d:${(videos.length + i) * 60}ms">
              <a class="game" href="${t.link}" target="_blank" rel="noopener" aria-label="Play ${t.title} on itch.io">
                <img class="blur" src="${src(t.img)}" alt="" aria-hidden="true">
                <img class="art${t.pixel ? ' pixel' : ''}" src="${src(t.cover || t.img)}" alt="${t.title} cover art" loading="lazy">
                <span class="cap">${t.from}</span>
                <span class="itch">Play on itch.io <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 17L17 7M8 7h9v9"/></svg></span>
              </a>
              <div class="vbody">
                <span class="kind">${t.use}</span>
                <h3>${t.title}</h3>
                <p>${t.text}</p>
                ${t.role ? `<span class="role-line"><b>My role</b>${t.role}</span>` : ''}
                ${t.team ? `<span class="team">Made ${t.team}</span>` : ''}
              </div>
            </article>`).join('')}
        </div>
        ${others.length ? `<div class="tracks-head">Audio</div>` : ''}
        <div class="tracks">
          ${others.map((t, i) => `
            <article class="track pv-in" id="${t.id}" data-item style="--d:${i * 60}ms">
              <div class="cover">
                <img src="${/^https?:/.test(t.img) ? t.img : `../assets/${t.img}`}" alt="" loading="lazy">
                <button class="play" ${t.audio ? `data-src="../assets/${t.audio}"` : 'disabled'} aria-label="Play ${t.title}">${playIcon}</button>
              </div>
              <div>
                <span class="kind">${t.use}</span>
                <h3>${t.title}</h3>
                <span class="from">${t.from}</span>
                <p>${t.text}</p>
                ${t.audio ? `${seek(t)}<div class="player-row"><span class="time">0:00</span></div>` : '<span class="soon">Audio coming soon</span>'}
              </div>
            </article>`).join('')}
        </div>
      </section>`;
    }).join('');
  }

  render();

  // ---------- Category sidebar: one link per category, highlights the section on screen ----------
  const toc = document.getElementById('toc');
  toc.insertAdjacentHTML('beforeend', types.map(t => `<a href="#${slug(t)}">${t}</a>`).join(''));
  const links = [...toc.querySelectorAll('a')];
  const mark = id => links.forEach(a => {
    const on = a.getAttribute('href') === '#' + id;
    a.classList.toggle('on', on);
    if (on && getComputedStyle(toc).display === 'flex') a.scrollIntoView({ block: 'nearest', inline: 'center' });   // mobile strip
  });
  // the current section is the last one whose top has passed 40% of the screen (or the last one at the page bottom)
  let shown = null;
  const update = () => {
    const groups = [...document.querySelectorAll('.group')];
    let id = groups[0].id;
    groups.forEach(g => { if (g.getBoundingClientRect().top <= innerHeight * .4) id = g.id; });
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) id = groups.at(-1).id;
    if (id !== shown) { shown = id; mark(id); }
  };
  addEventListener('scroll', update, { passive: true });
  addEventListener('resize', update);
  update();

  const thumbs = () => document.querySelectorAll('button.yt:not([data-ready])').forEach(b => {
    b.dataset.ready = '';
    b.insertAdjacentHTML('afterbegin', `<img src="https://i.ytimg.com/vi/${b.dataset.id}/hqdefault.jpg" alt="" loading="lazy"><span class="pl">${playIcon}</span>`);
  });
  thumbs();

  // one shared audio player for whichever track is playing
  const audio = new Audio();
  let current = null;
  document.addEventListener('click', e => {
    // SoundCloud cards: swap the artwork for SoundCloud's player (tracklist included)
    const sc = e.target.closest('.sc[data-sc]');
    if (sc) {
      if (sc.classList.contains('on')) return;
      audio.pause();
      sc.classList.add('on');
      sc.innerHTML = `<iframe src="https://w.soundcloud.com/player/?url=${encodeURIComponent(sc.dataset.sc)}&color=%232256f2&auto_play=true&show_artwork=true&visual=false&show_comments=false&show_reposts=false&hide_related=true" title="${sc.getAttribute('aria-label')}" allow="autoplay; encrypted-media"></iframe>`;
      return;
    }
    // video cards: swap the thumbnail for the YouTube player (and stop any MP3 that's playing)
    const yt = e.target.closest('button.yt');
    if (yt) {
      if (yt.classList.contains('on')) return;
      audio.pause();
      yt.classList.add('on');
      yt.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${yt.dataset.id}?autoplay=1&rel=0" title="${yt.getAttribute('aria-label')}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
      return;
    }
    // click on a progress bar: jump to that point (starts the track if it isn't the current one)
    const seek = e.target.closest('.progress-bar');
    if (seek) {
      const btn = seek.closest('[data-item]').querySelector('.play[data-src]');
      const pct = (e.clientX - seek.getBoundingClientRect().left) / seek.offsetWidth;
      if (current !== btn) select(btn);
      const jump = () => { audio.currentTime = pct * audio.duration; audio.play(); };
      audio.duration ? jump() : audio.addEventListener('loadedmetadata', jump, { once: true });
      return;
    }
    const btn = e.target.closest('.play[data-src]'); if (!btn) return;
    if (current === btn && !audio.paused) { audio.pause(); return; }
    if (current !== btn) select(btn);
    audio.play();
  });
  function select(btn) {
    if (current) {   // reset the previous track's controls
      current.innerHTML = playIcon;
      const t = current.closest('[data-item]');
      if (t) { t.querySelector('.progress-bar i').style.width = '0';
      t.querySelector('.time').textContent = '0:00'; }
    }
    audio.src = btn.dataset.src; current = btn;
  }
  const fmt = s => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '0:00';
  audio.addEventListener('play', () => current && (current.innerHTML = pauseIcon));
  audio.addEventListener('pause', () => current && (current.innerHTML = playIcon));
  audio.addEventListener('ended', () => { if (current) current.innerHTML = playIcon; });
  audio.addEventListener('timeupdate', () => {
    const t = current?.closest('[data-item]'); if (!t) return;
    if (audio.duration) t.querySelector('.progress-bar i').style.width = (audio.currentTime / audio.duration * 100) + '%';
    t.querySelector('.time').textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
  });

  // arriving from a home-page card: scroll to that item
  // put the video/player itself in the middle of the screen (re-checked as images load and shift the layout)
  (function () {
    const card = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (!card || !card.matches('.vcard, .track')) return;
    history.scrollRestoration = 'manual';
    document.documentElement.style.scrollBehavior = 'auto';
    const media = card.querySelector('button.yt, .game, .cover') || card;
    let userMoved = false;
    ['wheel', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, () => userMoved = true, { once: true, passive: true }));
    const focus = () => { if (!userMoved) media.scrollIntoView({ block: 'center' }); };
    focus();
    requestAnimationFrame(focus);
    setTimeout(focus, 400);
    addEventListener('load', () => { focus(); document.documentElement.style.scrollBehavior = ''; });
    card.classList.add('arrived');
  })();
</script>
</body>
</html>
